name: Build iOS (Simulator)

# Builds UrgeAway for the iOS Simulator in GitHub's cloud, whenever you push
# to main or trigger it manually. Requires a macOS runner (Xcode only runs
# on macOS) — GitHub provides these, no Mac of your own needed for this.
#
# IMPORTANT — read before expecting this to install on your iPhone:
# This produces an UNSIGNED build for the iOS SIMULATOR only. Apple requires
# a paid Apple Developer Program membership ($99/year) plus a signing
# certificate + provisioning profile to install on a real device or submit
# to TestFlight/the App Store — none of that exists yet in this repo, and
# it isn't something that can be generated without your Apple Developer
# account. Once you have those, this workflow can be extended to produce a
# signed .ipa the same way build-apk.yml produces a signed-enough debug APK
# — ask and it can be wired up once you can provide the certificate/profile
# as GitHub secrets.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install

      - name: Bundle native plugin bridges (notifications, push, auth)
        run: |
          npx esbuild www/js/notifications-entry.js --bundle --outfile=www/js/notifications-bundle.js --format=iife
          npx esbuild www/js/push-entry.js --bundle --outfile=www/js/push-bundle.js --format=iife
          npx esbuild www/js/auth-entry.js --bundle --outfile=www/js/auth-bundle.js --format=iife
          npx esbuild www/js/screenpinning-entry.js --bundle --outfile=www/js/screenpinning-bundle.js --format=iife
          # screenpinning-entry.js still bundles on iOS (it's just JS), but
          # its native half (capacitor-plugins/screen-pinning/android) has
          # no iOS implementation — Screen Pinning has no iOS equivalent,
          # so it safely no-ops there. See ScreenPinning usage in
          # www/js/urgelock.js for the iOS-specific Guided Access copy.

      - name: Add the iOS platform
        run: npx cap add ios

      - name: Add Firebase config (Auth + Cloud Messaging) if present
        run: |
          if [ -f "firebase/GoogleService-Info.plist" ]; then
            cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "Firebase config applied."
          else
            echo "No firebase/GoogleService-Info.plist found — skipping Firebase setup for this build."
            echo "Download this from Firebase Console > Project settings > your iOS app, and commit it to firebase/GoogleService-Info.plist to enable it."
          fi
        shell: bash

      - name: Sync web app into the iOS project
        run: npx cap sync ios

      - name: Generate app icons from resources/icon.png
        run: npx capacitor-assets generate --ios

      - name: Disable code signing + x86_64 for CocoaPods targets
        # Two separate problems patched here, both specific to CocoaPods
        # targets (command-line xcodebuild flags for these don't reliably
        # reach every Pods target — confirmed: EXCLUDED_ARCHS passed on the
        # command line alone still let x86_64 through for FirebaseCoreInternal):
        #  1. Xcode 15+ still signature-checks Firebase's resource-bundle
        #     targets even for an "unsigned" build with no dev team.
        #  2. GitHub's macos-14 runners are Apple Silicon (arm64) — building
        #     the x86_64 (Intel) simulator slice is unnecessary here and
        #     fails on Firebase pods that dropped x86_64 simulator support.
        run: |
          python3 - <<'EOF'
          path = "ios/App/Podfile"
          with open(path) as f:
              content = f.read()
          marker = "assertDeploymentTarget(installer)"
          addition = marker + """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'
                config.build_settings['ARCHS'] = 'arm64'
                config.build_settings['VALID_ARCHS'] = 'arm64'
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'x86_64'
              end
            end"""
          if marker in content and "CODE_SIGNING_ALLOWED" not in content:
              content = content.replace(marker, addition, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("Podfile patched: code signing disabled, arm64-only for Pods targets.")
          else:
              print("Podfile marker not found or already patched — leaving as-is.")
          EOF
        shell: bash

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      - name: Build for the iOS Simulator (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64 \
            build

      - name: Zip the .app bundle
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r UrgeAway-simulator.zip App.app

      - name: Upload the Simulator build so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: UrgeAway-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/UrgeAway-simulator.zip
